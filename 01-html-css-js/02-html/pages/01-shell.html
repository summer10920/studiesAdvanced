<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML 練習</title>
  </head>
  <body>
    <!-- TODO: 講義「認識 HTML 文件」。
         在 VS Code 新增 HTML 檔，打 ! 再按 Tab，會展開同一份骨架。展開後把語言改成 zh-Hant。
         「文件宣告與 html」：確認第一行是文件宣告。把 html 的 lang 暫時改成 en，存檔看畫面中文還在不在，再改回 zh-Hant。
         「head：給瀏覽器看的資訊」：charset 維持 UTF-8，viewport 維持手機寬度。把 title 改成「洛奇旅行」，存檔後看分頁標籤，畫面裡的字不會跟著改。
         「body：畫面上看到的內容」：用 div 寫「洛奇旅行的練習頁。這一行才出現在畫面裡。」再加一個 div 寫「分頁標籤上的字不會自動出現在這裡。」不要用 h1 或 p。 -->
  </body>
</html>
