<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>清單</title>
  </head>
  <body>
    <!-- TODO: 講義 02-html「清單」：無序 ul、有序 ol、巢狀、描述清單 dl／dt／dd。 -->
    <h1>清單</h1>
    <section>
      <h2>無序</h2>
      <ul>
        <li>待補項目</li>
      </ul>
    </section>
    <section>
      <h2>有序</h2>
      <ol>
        <li>待補步驟</li>
      </ol>
    </section>
    <section>
      <h2>巢狀</h2>
      <!-- TODO: ul 裡再放一層 ol 或 ul。 -->
    </section>
    <section>
      <h2>描述</h2>
      <dl>
        <dt>待補名詞</dt>
        <dd>待補說明</dd>
      </dl>
    </section>
  </body>
</html>
