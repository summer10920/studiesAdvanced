<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>出發前清單</title>
  </head>
  <body>
    <!-- TODO: 講義「清單」，同一頁依小節補完。
         「無序清單（ul）」：行李，沒有先後。
         「有序清單（ol）」：出境步驟。
         「巢狀清單」：某一項裡面再放一層，內層要包在 li 裡。
         「描述清單（dl）」：名詞對說明，用 dt、dd（alt、name）。 -->
    <h1>出發前清單</h1>
    <section>
      <h2>要帶的東西</h2>
      <ul>
        <li>待補</li>
      </ul>
    </section>
    <section>
      <h2>出境順序</h2>
      <ol>
        <li>待補</li>
      </ol>
    </section>
    <section>
      <h2>名詞</h2>
      <dl>
        <dt>待補</dt>
        <dd>待補</dd>
      </dl>
    </section>
  </body>
</html>
