<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表格</title>
  </head>
  <body>
    <!-- TODO: 講義 02-html「表格」：基本結構、合併儲存格、語意（caption、thead、tbody、tfoot、th 的 scope）。
         這一頁是資料表，不是用來切版面。 -->
    <h1>行程表</h1>
    <table>
      <caption>待補表題</caption>
      <thead>
        <tr>
          <th>名稱</th>
          <th>地點</th>
          <th>天數</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>待補</td>
          <td>待補</td>
          <td>待補</td>
        </tr>
      </tbody>
      <!-- TODO: colspan／rowspan 各做一列；表頭加上 scope；需要的話補 tfoot。 -->
    </table>
  </body>
</html>
