    <section id="gather">
      <h2>京都車站中央口</h2>
      <p>領隊會在中央口的時鐘下方舉牌。請看牌子上的團名「京都三日」，不要跟到隔壁的購物團。</p>
      <p>建議提前二十分鐘到。車站裡有兩座時鐘，請認銀色、面對八條口的那一座。</p>
      <p>遲到超過十五分鐘，隊伍會先移動到月台。請改撥頁面上的客服電話，不要自己叫車去清水寺。</p>
      <p>回程同樣在這個出口解散。護照請放在隨身包，不要放進行李箱。</p>
