<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>報名京都三日遊</title>
  </head>
  <body>
    <h1>報名京都三日遊</h1>
    <table>
      <!-- caption 是表名 -->
      <caption>京都三日遊價目</caption>
      <thead>
        <tr>
          <!-- scope="col"：這格是整欄的標題 -->
          <th scope="col">身分</th>
          <th scope="col">單價</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <!-- scope="row"：這格是整列的標題 -->
          <th scope="row">成人</th>
          <td>1600</td>
        </tr>
        <tr>
          <th scope="row">兒童</th>
          <td>800</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
