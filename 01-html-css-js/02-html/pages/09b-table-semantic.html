<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>價目表</title>
  </head>
  <body>
    <h1>價目表</h1>
    <table border="1">
      <caption>京都三日遊價目</caption>
      <thead>
        <tr>
          <th scope="col">項目</th>
          <th scope="col">人數</th>
          <th scope="col">單價</th>
          <th scope="col">小計</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">成人</th>
          <td>2</td>
          <td>1600</td>
          <td>3200</td>
        </tr>
        <tr>
          <th scope="row">兒童</th>
          <td>1</td>
          <td>800</td>
          <td>800</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row">合計</th>
          <td>3</td>
          <td></td>
          <td>4000</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
