<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>報名京都三日遊</title>
  </head>
  <body>
    <!-- TODO: 講義「表單」。同一頁依小節補完，不要寫 JavaScript。
         form 的 id 是 booking-form，action="#" method="get"。
         「表單容器（form）」：送出後停在這一頁；hidden 帶 source。
         「表單標籤與關聯（label）」：for 對 id，或把控制項包進 label。placeholder 不能代替標籤。
         「表單控制項通用屬性與驗證」：姓名 required、maxlength="20"。團號 readonly。已額滿梯次 disabled。
         「基本輸入元素（input）」：email、tel、number、date、file，以及密碼、網址、搜尋、range、時間、月份、週、顏色。
         「選擇元素」：交通 radio 共用 name="traffic"。加購 checkbox 共用 name="extra"。行程 select 用 optgroup。城市用 datalist。
         「文字區域（textarea）」：備註。
         「按鈕元素」：submit、reset、button 三種都要寫 type。
         「表單組織（fieldset、legend）」：報名資料一組，交通再圈一組。
         「progress 與 meter」：放在欄位下面，它們不是會送出的欄位。 -->
    <h1>報名京都三日遊</h1>
    <p>送出後仍停在這一頁，網址後面會出現欄位名稱與內容。</p>
    <form id="booking-form" action="#" method="get">
      <fieldset>
        <legend>報名資料</legend>
        <p>
          <label for="guest-name">姓名</label>
          <input id="guest-name" name="name" />
        </p>
        <!-- TODO: 依上面的註解把其餘欄位、選項與三顆按鈕補完。 -->
      </fieldset>
    </form>
  </body>
</html>
