<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多媒體</title>
  </head>
  <body>
    <!-- TODO: 講義 02-html「多媒體」：img、figure／figcaption、video、audio、iframe。
         圖片用 picsum 或 placehold，每張都要有 alt。 -->
    <h1>多媒體</h1>
    <figure>
      <img src="https://picsum.photos/id/1015/800/450" alt="" width="800" height="450" />
      <!-- TODO: 補上替代文字，並加 figcaption。 -->
    </figure>
    <p>
      <img src="https://placehold.co/320x180?text=tour" alt="" width="320" height="180" />
    </p>
    <!-- TODO: video、audio 加上 controls。還沒有檔案可先把標籤留在註解裡。 -->
    <!-- TODO: iframe 要有 title，嵌入地圖或影片。寬高不要撐破畫面。 -->
  </body>
</html>
