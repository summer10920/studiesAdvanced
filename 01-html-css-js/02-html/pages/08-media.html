<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>京都素材</title>
  </head>
  <body>
    <!-- TODO: 講義「多媒體」，同一頁依小節補完。不要寫 JavaScript。
         「圖片元素（img）」：figure 包一張清水寺照片（picsum）與 figcaption，alt 寫畫面內容，並寫上 width、height。
         再放一張 placehold 示意圖，alt 不要寫「圖片」。
         「影音元素」：video、audio 加上 controls，裡面用 source，並留一句瀏覽器不支援時看得到的文字。
         「嵌入元素（iframe）」：嵌入同資料夾的 03-layout.html，一定要有 title。 -->
    <h1>京都素材</h1>
    <figure>
      <img src="https://picsum.photos/id/1015/800/450" alt="" width="800" height="450" />
    </figure>
    <p>
      <img src="https://placehold.co/320x180?text=map" alt="" width="320" height="180" />
    </p>
    <!-- TODO: video、audio、iframe -->
  </body>
</html>
