<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>描述清單</title>
  </head>
  <body>
    <h1>名詞</h1>
    <dl>
      <dt>標籤</dt>
      <dd>用角括號包住的標記，例如 p 是段落。</dd>
      <dt>屬性</dt>
      <dd>寫在開始標籤裡的設定，例如連結的 href。</dd>
      <dd>寫法是名稱加等號，再加雙引號包住的值。</dd>
    </dl>
  </body>
</html>
