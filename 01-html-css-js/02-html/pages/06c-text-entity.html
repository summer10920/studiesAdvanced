    <title>字元實體</title>
  </head>
  <body>
    <h1>畫面上的符號</h1>
    <p>小於號寫成 &lt;，大於號寫成 &gt;。</p>
    <p>公司名寫成洛奇 &amp; 夥伴，畫面上會看到和號。</p>
    <p>要讓畫面印出 &amp;lt; 這四個字元，連和號也要寫成實體。</p>
    <p>手提行李以 7&nbsp;kg 為限，數字和單位不會被拆成兩行。</p>
    <p>&copy; 2026 洛奇旅行</p>
  </body>
</html>
