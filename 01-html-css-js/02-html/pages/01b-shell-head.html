<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <!-- 字元編碼：放在 head 最前面 -->
    <meta charset="UTF-8" />
    <!-- 視窗設定：依裝置寬度排版，initial-scale=1.0 表示不要預先縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 分頁標籤上的文字，不會畫在頁面裡 -->
    <title>京都三日遊 · 行前</title>
  </head>
  <body>
    <div>這是 body 裡的文字，分頁標題不會出現在這裡。</div>
  </body>
</html>
