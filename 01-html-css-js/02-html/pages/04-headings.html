<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>標題與段落</title>
  </head>
  <body>
    <!-- TODO: 講義 02-html「標題與段落」，含「標題標籤（h1～h6）」「段落標籤（p）」「換行與分隔」。
         整頁只留一個 h1，往下不要跳級。換行用 br，主題分隔用 hr。 -->
    <h1>洛奇旅行</h1>
    <p>待補一段介紹。需要斷行時再用 br。</p>
    <!-- TODO: 依序補上 h2～h6，每級下面各放一段 p。 -->
    <h2>待補小標</h2>
    <p>待補。</p>
  </body>
</html>
