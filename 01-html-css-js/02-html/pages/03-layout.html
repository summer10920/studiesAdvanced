<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>版面：語意標籤</title>
  </head>
  <body>
    <!-- TODO: 講義 02-html「語意標籤」。用 header、nav、main、section、article、aside、footer 搭一頁骨架。
         不要用沒有名字的 div 假裝頁首或主文。品牌用洛奇旅行。 -->
    <header>
      <p>頁首：招牌放這裡。</p>
      <nav>
        <ul>
          <li>首頁</li>
          <li>行程</li>
          <li>報名</li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>洛奇旅行</h1>
      <!-- TODO: 用 section 切主題；每篇行程用 article，各自有標題。 -->
      <section>
        <h2>行程</h2>
        <article>
          <h3>待補行程名稱</h3>
          <p>待補一段介紹。</p>
        </article>
      </section>
      <aside>
        <p>側欄：注意事項稍後再寫。</p>
      </aside>
    </main>
    <footer>
      <p>頁尾：版權與聯絡。</p>
    </footer>
  </body>
</html>
