    <!-- TODO: 講義「文字」。同一頁依小節把標籤用在句子裡，不要只寫標籤名字。
         「語意化強調標籤」：strong、em、mark、del、ins。
         「外觀效果標籤」：b、i、u、s、sub、sup、small。
         「程式碼顯示」：code、kbd、samp、var、pre。
         「引用與引言」：q、blockquote、cite。
         「縮寫、時間、聯絡、摺疊」：abbr、time、address、details／summary。
         「符號（字元）實體化」：要在畫面上看到 <、>、&、空白與 ©，原始碼寫字元實體。 -->
    <h1>京都三日遊 · 行前須知</h1>
    <p>待補：護照很重要、這趟是自由行、集合點要畫重點。</p>
