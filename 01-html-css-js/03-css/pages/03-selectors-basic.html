<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基本選擇器</title>
    <style>
      /* TODO: 講義「元素、class 與 id」
         元素、class、兩個 class 寫在一起、id，各寫一條。
         顏色只用 #475569、#0f766e、#64748b。
      */
    </style>
  </head>
  <body>
    <!-- TODO: 講義「元素、class 與 id」。p 石板色 #475569，.tour 深青綠 #0f766e，.soldout 刪除線，.tour.soldout（中間無空格）灰色 #64748b，#featured 字重 700。換你試試：加 .hot 與 .tour.hot，第二段行程改成同時有 tour 與 hot，顏色 #9f1239。 -->
    <h1>選擇器決定規則打到誰</h1>
    <p>元素選擇器：這段是石板色。</p>
    <p class="tour">class：行程用字。同一個 class 可以再出現一次。</p>
    <p class="tour">另一段行程，顏色跟上面那行相同。</p>
    <p class="tour soldout">兩個 class 都在：字是灰的，而且有刪除線。</p>
    <p id="featured">id：全頁這一個，字重較粗。</p>
  </body>
</html>
