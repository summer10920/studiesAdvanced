<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>變數</title>
    <style>
      :root {
        --brand: #0f766e;
        --gap: 1rem;
      }

      body {
        margin: 1.5rem;
        font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      .card {
        margin-bottom: var(--gap);
        padding: 1rem;
        background: #f0fdfa;
      }

      .price {
        color: var(--brand);
      }

      .sale {
        --brand: #9f1239; /* 子層覆寫，只影響這張卡片裡面 */
      }

      .missing {
        color: var(--missing, #475569); /* 逗號後面是找不到時才用 */
      }
    </style>
  </head>
  <body>
    <h1>變數</h1>
    <article class="card">
      <h2>京都三日</h2>
      <p class="price">NT$12,800</p>
    </article>
    <article class="card sale">
      <h2>大阪美食</h2>
      <p class="price">NT$9,600</p>
    </article>
    <p class="missing">這段的顏色名稱不存在，所以用備援。</p>
  </body>
</html>
