<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定位</title>
    <link rel="stylesheet" href="18-position.css" />
  </head>
  <body>
    <!-- TODO: 講義「定位與 z-index」。卡片 relative，徽章 absolute 在右上。兩塊色塊重疊，z-index 較大的在上面。白盒 overflow: auto 並做出 sticky。右下角 fixed。換你試試：徽章改到左下。 -->
    <h1>座標跟誰比</h1>
    <article class="card">
      <span class="badge">熱門</span>
      <h2>京都三日</h2>
      <p>徽章對準這張卡片，不是整頁。</p>
    </article>
    <div class="pile">
      <span class="layer low">下層</span>
      <span class="layer high">上層</span>
    </div>
    <div class="scroller">
      <p class="sticky">這行會黏在這個盒子的上緣</p>
      <p>往下捲這塊白盒，標題黏住，直到盒子捲完。</p>
      <p>父層結束後，黏性也結束。</p>
    </div>
    <p class="pin">固定在視窗右下</p>
  </body>
</html>
