<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盒子模型</title>
    <style>
      /* TODO: 講義「盒子模型」
         width 在 border-box 時含內距與邊框。
         左右 margin: auto 才會水平置中。outline 不佔寬高。
      */
    </style>
  </head>
  <body>
    <!-- TODO: 講義「盒子模型」。開頭把 box-sizing 改成 border-box，偽元素也要。卡片含寬度、auto 外距、內距、粗框、圓角。兩條軌道對照 border-box 與 content-box。垂直外距合併。連結用 focus-visible 的 outline。換你試試：第二條也改回 border-box，圓角改 1.5rem。 -->
    <h1>盒子四層</h1>
    <div class="stage">
      <article class="card">
        <p class="content">淺藍是內容。卡片的淺綠含內距。粗框是邊框。框外淺青是外距。</p>
      </article>
    </div>
    <h2>兩種算法</h2>
    <div class="track"><div class="kid">border-box：對齊虛線。</div></div>
    <div class="track content-box"><div class="kid">content-box：虛線包不住。</div></div>
    <h2>垂直外距合併</h2>
    <div class="collapse">
      <p>這段下外距是 2rem。</p>
      <p>上外距只有 0.5rem。中間是較大的 2rem。</p>
    </div>
    <p><a class="go" href="#top">看行程</a>（用 Tab 移來，焦點框不改變按鈕尺寸）</p>
  </body>
</html>
