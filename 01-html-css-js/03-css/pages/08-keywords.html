<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>繼承關鍵字</title>
    <link rel="stylesheet" href="08-keywords.css" />
  </head>
  <body>
    <!-- TODO: 講義「四個關鍵字」。.keywords 藍字。.in 用 inherit，.init 用 initial，.un 用 unset。.back h2 先把字級與字重改小，再用 revert 交回瀏覽器。換你試試：.init 改成 inherit。 -->
    <h1>明示跟父層，或回到初始</h1>
    <div class="keywords">
      <p class="in">inherit：字跟父層的藍。</p>
      <p class="init">initial：字回到屬性初始值。</p>
      <p class="un">unset：顏色會繼承，所以仍是藍字。</p>
    </div>
    <section class="back">
      <h2>這顆標題用了 revert，字級與字重回到瀏覽器預設。</h2>
    </section>
  </body>
</html>
