<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>繼承關鍵字</title>
    <style>
      .keywords {
        color: #1d4ed8;
      }

      p {
        color: #be123c; /* 所有段落先被改成玫瑰紅 */
      }

      .in {
        color: inherit; /* 跟父層的藍 */
      }

      .init {
        color: initial; /* 屬性自己的初始值 */
      }

      .un {
        color: unset; /* color 會繼承，所以等於 inherit */
      }

      h2 {
        font-size: 1rem;
        font-weight: 400;
      }

      .restore {
        font-size: revert; /* 丟掉上面 h2 的規則，回到瀏覽器預設 */
        font-weight: revert;
      }
    </style>
  </head>
  <body>
    <h1>明示跟父層，或回到初始</h1>
    <div class="keywords">
      <p>沒寫關鍵字：玫瑰紅。</p>
      <p class="in">inherit：跟父層的藍。</p>
      <p class="init">initial：回到初始字色。</p>
      <p class="un">unset：color 會繼承，所以是藍。</p>
    </div>
    <h2>這顆標題被改成小而細</h2>
    <h2 class="restore">這顆用了 revert，回到瀏覽器預設的大小與粗細</h2>
  </body>
</html>
