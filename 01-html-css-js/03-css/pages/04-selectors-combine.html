<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>組合關係</title>
    <link rel="stylesheet" href="04-selectors-combine.css" />
  </head>
  <body>
    <h1>組合</h1>
    <article>
      <p class="direct">文章裡的第一段。</p>
      <div>
        <p>再包一層的段落。</p>
      </div>
    </article>
    <h2>停留站</h2>
    <p>站名之前的說明。</p>
    <p>另一段說明。</p>
    <ul class="stops">
      <li>台北</li>
      <li>花蓮</li>
      <li>台東</li>
    </ul>
  </body>
</html>
