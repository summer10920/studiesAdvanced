<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轉場</title>
    <style>
      body {
        margin: 1.5rem;
        font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      .card {
        width: min(100%, 20rem);
        padding: 1rem;
        background: #ccfbf1;
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-0.35rem);
      }
    </style>
  </head>
  <body>
    <h1>兩個狀態之間</h1>
    <article class="card">
      <h2>抬起的卡片</h2>
      <p>滑鼠放上來時往上移，移開時回到原位。</p>
    </article>
  </body>
</html>
