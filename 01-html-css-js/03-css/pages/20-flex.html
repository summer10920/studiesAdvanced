<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 1.5rem;
        color: #134e4a;
        font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      .bar {
        display: flex;
        justify-content: space-between; /* 主軸：品牌與連結分到兩端 */
        align-items: center; /* 交叉軸：垂直置中 */
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: #115e59;
        color: #f0fdfa;
      }

      .bar a {
        color: inherit;
      }

      .trips {
        display: flex;
        flex-wrap: wrap; /* 放不下才換行 */
        gap: 1rem;
        margin-top: 1rem;
      }

      .trip {
        display: flex;
        flex-direction: column; /* 卡片內改成直排 */
        flex: 1 1 14rem; /* 可長、可縮、理想寬度 14rem */
        padding: 1rem;
        background: #f0fdfa;
      }

      .trip a {
        margin-top: auto; /* 吃掉上方剩餘空間，連結被推到底部 */
      }
    </style>
  </head>
  <body>
    <h1>沿一個方向排</h1>
    <header class="bar">
      <strong>洛奇旅行</strong>
      <nav>
        <a href="#tours">行程</a>
        <a href="#about">關於</a>
      </nav>
    </header>
    <div class="trips">
      <article class="trip">
        <h2>京都三日</h2>
        <p>清水寺與嵐山。</p>
        <a href="#kyoto">看行程</a>
      </article>
      <article class="trip">
        <h2>大阪美食</h2>
        <p>這張字比較多，用來把連結推到卡片底部。</p>
        <a href="#osaka">看行程</a>
      </article>
    </div>
  </body>
</html>
