<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 1.5rem;
        color: #134e4a;
        font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      .trips {
        display: grid;
        /* 每欄至少 12rem，放得下幾欄就切幾欄，剩餘空間平均分 */
        grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
        gap: 1rem;
      }

      .trips article {
        padding: 1rem;
        background: #f0fdfa;
      }

      .feature {
        grid-column: 1 / -1; /* 從第一條欄線到最後一條，整列都佔 */
        background: #ccfbf1;
      }
    </style>
  </head>
  <body>
    <h1>欄與列一起排</h1>
    <div class="trips">
      <article class="feature">
        <h2>京都三日</h2>
        <p>這一張佔滿整列。</p>
      </article>
      <article>
        <h2>大阪</h2>
        <p>一格。</p>
      </article>
      <article>
        <h2>濟州</h2>
        <p>一格。</p>
      </article>
      <article>
        <h2>花蓮</h2>
        <p>一格。</p>
      </article>
      <article>
        <h2>台北</h2>
        <p>一格。</p>
      </article>
    </div>
  </body>
</html>
