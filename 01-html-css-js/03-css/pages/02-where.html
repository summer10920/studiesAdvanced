<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 寫在哪</title>
    <link rel="stylesheet" href="02-where.css" />
  </head>
  <body>
    <!-- TODO: 講義「三種寫法」。第一段用標籤上的 style 寫顏色 #9f1239。在 head 加 style，讓 .from-page 成為 #b45309。02-where.css 讓 .from-file 成為 #115e59 且字重 700。換你試試：拿掉行內 style，改 class from-inline，顏色改寫進外部檔。 -->
    <h1>三種地方都可以寫</h1>
    <p>這行的顏色寫在開始標籤上。</p>
    <p class="from-page">這行的顏色寫在這頁的 style。</p>
    <p class="from-file">這行的顏色寫在外部樣式表。</p>
  </body>
</html>
