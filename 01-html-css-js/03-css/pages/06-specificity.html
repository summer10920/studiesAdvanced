<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>權重</title>
    <style>
      /* TODO: 講義「四欄權重」
         先寫一般規則，最後才用 important 當對照。
         換你試試時把 important 拿掉，改成 #sale。

    </style>

  <body>
    <!-- TODO: 講義「四欄權重」。p、.note、#one 依序用石板、琥珀、深青綠。行內那段已寫在標籤上。 .chip 寫兩次，留下較下面的 #115e59。 .force 先灰再玫瑰紅，玫瑰紅加 important。換你試試：拿掉 important，改用 id sale 留下玫瑰紅。 -->
    <h1>誰贏</h1>
    <p>只有元素選擇器：石板色。</p>
    <p class="note">加上 class：琥珀色。</p>
    <p id="one" class="note">同時有 id 與 class：深青綠。</p>
    <p id="two" class="note" style="color: #9f1239">行內樣式：玫瑰紅。</p>
    <p class="chip">同權重寫了兩次，留下較下面的深青綠。</p>
    <p class="force">這段用了 important，留下玫瑰紅。</p>
  </body>
</html>
