<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>單位</title>
    <style>
      /* TODO: 講義「長度」
         em 相對父層，rem 相對根。一半寬用百分比，寫在已經是區塊的 div 上。
         不要用 vw 當正文。
      */
    </style>
  </head>
  <body>
    <!-- TODO: 講義「長度」。html 字級 16px 只為了對數字。做出 1.25em 父層與 2em 子層、1.25rem 父層與 2rem 子層、16rem 軌道與 50% 的一半、36ch 行寬、4vw 標題。換你試試：em 子層改成 2rem。 -->
    <h1>單位</h1>
    <p>這頁把根字級設成 16px，只為了讓 Computed 好對。</p>
    <div class="em-box">
      父層 1.25em
      <p class="em-child">子層 2em，相對父層，約 40px。</p>
    </div>
    <div class="rem-box">
      父層 1.25rem
      <p class="rem-child">子層 2rem，相對根元素，約 32px。</p>
    </div>
    <div class="meter">
      <div class="half">父層一半寬</div>
    </div>
    <p class="measure">這段最寬約 36 個 0 的寬度。中文不會剛好 36 個字，行寬仍收得住。</p>
    <p class="vw-title">這行會跟著視窗寬度變</p>
  </body>
</html>
