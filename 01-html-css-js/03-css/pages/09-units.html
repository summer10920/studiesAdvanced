<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>長度</title>
    <link rel="stylesheet" href="09-units.css" />
  </head>
  <body>
    <h1>長度</h1>
    <p>比較字級時先改 html 的字級，看 rem 是否一起變。</p>
    <div class="em-box">
      <p class="em-child">em</p>
    </div>
    <div class="rem-box">
      <p class="rem-child">rem</p>
    </div>
    <div class="meter"><span class="half">一半</span></div>
    <p class="measure">一段有最大寬度的內文。</p>
    <p class="vw-title">隨視窗變寬的標題</p>
  </body>
</html>
