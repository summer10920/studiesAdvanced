<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>顏色</title>
    <link rel="stylesheet" href="10-colors.css" />
  </head>
  <body>
    <!-- TODO: 講義「顏色寫法」。清單分別用名稱、六碼、rgb、帶 50% 透明的 rgb、hsl。 .tag 的背景用 currentColor。斜紋用 repeating-linear-gradient，.frost 用 70% 淺底。換你試試：兩處透明度改成 100%。 -->
    <h1>同一套顏色，很多種寫法</h1>
    <ul>
      <li class="named">名稱 teal</li>
      <li class="hex">六碼色票</li>
      <li class="rgb">rgb 空格寫法</li>
      <li class="mix">同一色，一半透明</li>
      <li class="hsl">hsl，亮度在第三個數</li>
    </ul>
    <p class="tag">這行的底跟字同一色</p>
    <div class="stripe">
      <p class="frost">半透明的底會透出底下的斜紋。</p>
    </div>
  </body>
</html>
