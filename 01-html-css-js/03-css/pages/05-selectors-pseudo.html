<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>偽類與偽元素</title>
    <link rel="stylesheet" href="05-selectors-pseudo.css" />
  </head>
  <body>
    <h1>偽類</h1>
    <p>看<a href="#days">行程天數</a>。</p>
    <ul class="days" id="days">
      <li>第一天</li>
      <li>第二天</li>
      <li>第三天</li>
      <li>第四天</li>
    </ul>
    <section class="pitfall">
      <h2>注意</h2>
      <p>偽元素要有 content 才看得到。</p>
    </section>
    <p class="price">NT$12800</p>
    <p>
      <input type="email" placeholder="Email" />
      <input type="text" placeholder="姓名" />
      <input type="text" />
    </p>
  </body>
</html>
