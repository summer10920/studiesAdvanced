<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一條規則</title>
    <style>
      /* TODO: 講義「規則的零件」
         h1、h2 共用 font-weight。h1 寫兩次 color，留下 #115e59，並留一行拼錯的 colour。
         .lead 只改字級。不要寫外距與邊框。
      */
    </style>
  </head>
  <body>
    <!-- TODO: 講義「規則的零件」。樣式只寫在 head 的 style。h1 與 h2 共用字重。h1 的 color 寫兩次，較下面留下 #115e59，中間故意拼錯 colour。h1 字級 1.75rem，.lead 字級 1.125rem。換你試試：加 h3「行前準備」進同一組字重，留下的顏色改成 #0f766e。 -->
    <h1>一條規則三個零件</h1>
    <p class="lead">標題應是深青綠，不是紅色。</p>
    <h2>次標題跟主標題共用字重</h2>
    <p>這段沒有自己的 class，字級是瀏覽器預設。</p>
  </body>
</html>
