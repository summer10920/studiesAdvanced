<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>邏輯方向</title>
    <style>
      /* TODO: 講義「選讀：邏輯方向」
         用 inline 與 inline-start，不要寫死 left。
         想看換邊時，可在 html 加上 dir="rtl" 再改回來。
      */
    </style>
  </head>
  <body>
    <!-- TODO: 選讀「邏輯方向」。卡片 margin-inline: auto、行首內距、行首 6px 邊框，最大寬度 24rem。 -->
    <article class="card">
      <h1>行首有一條邊</h1>
      <p>橫書時，這條邊在左邊。方向改成由右至左時，它會跟著行首走到右邊。</p>
    </article>
  </body>
</html>
