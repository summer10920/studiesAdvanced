<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>翻面</title>
    <style>
      body {
        margin: 1.5rem;
        font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      .scene {
        width: 10rem;
        height: 6rem;
        perspective: 40rem; /* 視距 */
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.6s;
        transform-style: preserve-3d; /* 保留 3D 空間 */
      }

      .scene:hover .card {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        margin: 0;
        text-align: center;
        line-height: 6rem;
        backface-visibility: hidden; /* 轉到背後時不畫 */
      }

      .front {
        background: #115e59;
        color: #f0fdfa;
      }

      .back {
        background: #9f1239;
        color: #fff;
        transform: rotateY(180deg); /* 先轉到背後 */
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="card">
        <p class="face front">正面</p>
        <p class="face back">背面</p>
      </div>
    </div>
  </body>
</html>
