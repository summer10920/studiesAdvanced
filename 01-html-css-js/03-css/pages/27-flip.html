<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>翻面</title>
    <style>
      /* TODO: 講義「選讀：視距與背面」
         轉場寫在 .card，時間約 0.6s。
         沒有 backface-visibility 時兩面會疊在一起。
      */
    </style>
  </head>
  <body>
    <!-- TODO: 選讀「視距與背面」。場景寫 perspective。卡片 preserve-3d，hover 時 rotateY(180deg)。背面先轉 180 度，兩面都隱藏背面。 -->
    <div class="scene">
      <div class="card">
        <p class="face front">正面</p>
        <p class="face back">背面</p>
      </div>
    </div>
  </body>
