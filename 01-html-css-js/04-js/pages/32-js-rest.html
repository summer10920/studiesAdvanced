<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>其餘參數</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      function sumAll(...numbers) {
        let total = 0;
        for (let i = 0; i < numbers.length; i += 1) {
          total += numbers[i];
        }
        return total;
      }

      console.log(sumAll(10, 20, 30));
      console.log(sumAll(5));
      console.log(sumAll());
    </script>
  </body>
</html>
