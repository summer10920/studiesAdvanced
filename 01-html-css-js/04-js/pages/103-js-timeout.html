<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>setTimeout</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      console.log('開始');

      setTimeout(() => {
        console.log('一秒後');
      }, 1000);

      console.log('結束');
    </script>
  </body>
</html>
