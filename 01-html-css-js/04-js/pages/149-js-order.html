<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>執行順序</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      console.log('A');
      setTimeout(() => {
        console.log('B');
      }, 0);
      console.log('C');
    </script>
  </body>
</html>
