<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>if、else if、else</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      const score = 75;
      let grade;

      if (score >= 90) {
        grade = 'A';
      } else if (score >= 80) {
        grade = 'B';
      } else if (score >= 60) {
        grade = 'C';
      } else {
        grade = 'F';
      }

      console.log(grade);

      if (score >= 60) {
        console.log('通過');
      }
    </script>
  </body>
</html>
