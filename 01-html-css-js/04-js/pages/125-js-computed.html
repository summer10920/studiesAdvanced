<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>getComputedStyle</title>
    <style>
      #box { color: #0f766e; }
    </style>
  </head>
  <body>
    <p id="box">盒子</p>
    <script>
      const box = document.querySelector('#box');
      console.log(box.style.color);
      console.log(getComputedStyle(box).color);
    </script>
  </body>
</html>
