<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>匿名函式</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      console.log(sumDeclared(2, 3));

      function sumDeclared(a, b) {
        return a + b;
      }

      // console.log(add(2, 3));

      const add = function (a, b) {
        return a + b;
      };

      console.log(add(2, 3));
    </script>
  </body>
</html>
