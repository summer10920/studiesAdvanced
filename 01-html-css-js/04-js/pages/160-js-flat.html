<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>改寫巢狀地獄</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      const step = (label) => {
        return new Promise((resolve) => {
          setTimeout(() => {
            console.log(label);
            resolve(label);
          }, 10);
        });
      };

      step('第一步')
        .then(() => step('第二步'))
        .then(() => step('第三步'))
        .catch((error) => {
          console.log(error.message);
        });
    </script>
  </body>
</html>
