<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>console.log、console.warn 與 console.error</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      console.log('Hello JavaScript');
      console.log('一般訊息');
      console.warn('這是提醒');
      console.error('這是錯誤');
    </script>
  </body>
</html>
