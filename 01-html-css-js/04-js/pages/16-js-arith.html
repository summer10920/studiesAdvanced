<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>算術運算子與賦值運算子</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      let total = 90;
      const people = 4;
      const each = total / people;

      console.log(each);
      console.log(7 % 3);
      console.log(2 ** 3);

      total += 10;
      console.log(total);

      total -= 20;
      console.log(total);

      console.log(each);
    </script>
  </body>
</html>
