<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微任務優先</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      console.log('同步');
      queueMicrotask(() => {
        console.log('微任務');
      });
      setTimeout(() => {
        console.log('任務');
      }, 0);
      console.log('同步結束');
    </script>
  </body>
</html>
