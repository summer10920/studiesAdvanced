<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>註解</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      // 單行註解：兩條斜線到行尾都不會執行
      console.log('第一行');

      /*
      多行註解：
      中間每一行都不會執行
      */
      // console.log('被註解掉的程式');

      console.log('第二行'); // 行尾註解
    </script>
  </body>
</html>
