<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>錯誤類型</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <!-- TODO: 講義「錯誤類型」。SyntaxError 只註解並說明整份腳本會停。ReferenceError、TypeError、RangeError 各用 try 接住，印 name 與 message。換你試試：對 null 呼叫 toFixed(0)。 -->
    <script>
      // TODO: 講義「錯誤類型」
      // SyntaxError：括號沒配對的那一行保持註解，否則整份腳本無法執行
      // ReferenceError：使用尚未宣告的名字，try 接住後印 name 與 message
      // TypeError：數字呼叫 toUpperCase
      // RangeError：new Array(-1)
      // 最後印「三種錯誤都接住了」
      // 換你試試：再包一個 try，對 null 呼叫 toFixed(0)
    </script>
  </body>
</html>
