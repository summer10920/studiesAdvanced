<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>常數與基本運算</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      console.log(Math.PI);
      console.log(Math.E);

      console.log(2 ** 3);
      console.log(Math.sqrt(16));
    </script>
  </body>
