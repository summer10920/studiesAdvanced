<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>callback</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。</p>
    <script>
      const done = (name) => {
        console.log(name);
      };

      const loadName = (callback) => {
        setTimeout(() => {
          callback('小安');
        }, 10);
      };

      console.log('開始');
      loadName(done);
      console.log('已登記');
    </script>
  </body>
</html>
