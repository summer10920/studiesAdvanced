<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>display</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>display</h1>
    <h2>block</h2>
    <div class="block">甲</div>
    <div class="block">乙</div>
    <h2>inline</h2>
    <p class="line"><span class="item">甲</span><span class="item">乙</span></p>
    <h2>inline-block</h2>
    <p class="days"><span class="day">一</span><span class="day">二</span><span class="day">三</span></p>
    <h2>拿掉元素</h2>
    <p>前<span class="cell">甲</span><span class="cell gone">乙</span><span class="cell">丙</span>後</p>
    <p>前<span class="cell">甲</span><span class="cell hold">乙</span><span class="cell">丙</span>後</p>
    <p>前<span class="cell">甲</span><span class="cell ghost">乙</span><span class="cell">丙</span>後</p>
    <h2>圖片</h2>
    <p><img class="photo" src="https://picsum.photos/id/1015/240/160" alt="河谷" width="240" height="160" /></p>
    <p><img class="photo middle" src="https://placehold.co/240x160?text=tour" alt="占位圖" width="240" height="160" /></p>
    <p><img class="photo block" src="https://picsum.photos/id/1016/240/160" alt="山路" width="240" height="160" /></p>
  </body>
</html>
