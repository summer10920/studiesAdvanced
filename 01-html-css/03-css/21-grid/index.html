<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Grid</h1>
    <h2>軌道</h2>
    <div class="tracks">
      <div class="cell">1</div>
      <div class="cell">2</div>
      <div class="cell wide">3 跨欄</div>
    </div>
    <div class="safe">
      <div class="cell">窄螢幕也要放得下</div>
      <div class="cell">第二格</div>
    </div>
    <h2>版面</h2>
    <div class="shell">
      <header>頁首</header>
      <nav>選單</nav>
      <main>主文</main>
      <aside>側欄</aside>
      <footer>頁尾</footer>
    </div>
    <h2>卡片</h2>
    <div class="cards">
      <article class="card">
        <img src="https://picsum.photos/id/1015/640/360" alt="河谷" />
        <h3>京都</h3>
        <p>三日。</p>
        <a class="go" href="#kyoto">看行程</a>
      </article>
      <article class="card">
        <img src="https://picsum.photos/id/1016/640/360" alt="山路" />
        <h3>大阪</h3>
        <p>美食。</p>
        <a class="go" href="#osaka">看行程</a>
      </article>
      <article class="card">
        <img src="https://placehold.co/640x360?text=nara" alt="奈良占位圖" />
        <h3>奈良</h3>
        <p>半日。</p>
        <a class="go" href="#nara">看行程</a>
      </article>
    </div>
    <h2>對齊</h2>
    <div class="align">
      <div class="cell">一般</div>
      <div class="cell pin">對齊到終點</div>
    </div>
  </body>
</html>
