<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 變數</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>變數</h1>
    <div class="swatches">
      <span class="brand">品牌色</span>
      <span class="ink">文字色</span>
      <span class="paper">紙色</span>
    </div>
    <article class="card">
      <h2>日間 <span class="tag">熱門</span></h2>
      <p>用變數上色，不要把色碼散落在每條規則。</p>
      <a href="#book">報名</a>
    </article>
    <article class="card night">
      <h2>夜間</h2>
      <p>這張覆寫同一組變數。</p>
      <a href="#book">報名</a>
    </article>
    <p class="bad">變數名稱打錯時應看到備援色。</p>
  </body>
</html>
