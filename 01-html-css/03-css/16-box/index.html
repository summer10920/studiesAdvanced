<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盒子模型</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>盒子</h1>
    <div class="stage">
      <article class="card">
        <p class="content">卡片內文</p>
      </article>
    </div>
    <h2>border-box</h2>
    <div class="track"><div class="kid">預設</div></div>
    <div class="track content-box"><div class="kid">對照</div></div>
    <h2>外距重疊</h2>
    <div class="collapse">
      <p>第一段</p>
      <p>第二段</p>
    </div>
    <h2>票券</h2>
    <article class="ticket">
      <h3>台北城市漫遊</h3>
      <p>三天</p>
      <span class="chip">步行</span>
      <span class="chip">小吃</span>
      <p><a class="go" href="#top">看詳情</a></p>
    </article>
  </body>
</html>
