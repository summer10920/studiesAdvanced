<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定位</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>定位</h1>
    <h2>相對位移</h2>
    <div class="shift">我位移了，原來的空位還在。</div>
    <div class="next">下一個區塊。</div>
    <h2>徽章</h2>
    <article class="tour">
      <span class="badge">熱門</span>
      <h3>花蓮山海</h3>
      <p>三天兩夜。</p>
    </article>
    <h2>黏住小標</h2>
    <div class="scroller">
      <section class="day">
        <h3>第一天</h3>
        <p>待補。</p>
        <p>待補。</p>
      </section>
      <section class="day">
        <h3>第二天</h3>
        <p>待補。</p>
        <p>待補。</p>
      </section>
    </div>
    <h2>堆疊</h2>
    <div class="pile">
      <div class="sheet a">甲</div>
      <div class="sheet b">乙</div>
      <div class="sheet c">丙</div>
    </div>
    <h2>各自的層疊情境</h2>
    <div class="contexts">
      <div class="ctx ctx-a"><span class="kid">A</span></div>
      <div class="ctx ctx-b"><span class="kid">B</span></div>
    </div>
    <p><a class="ask" href="#top">詢問</a></p>
  </body>
</html>
