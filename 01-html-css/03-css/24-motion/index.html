<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轉場與動畫</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- TODO: 講義「轉場與動畫」三小節都寫在這份。 -->
    <h1>動態</h1>
    <h2>變形</h2>
    <div class="slots">
      <div class="slot"><div class="box move">位移</div></div>
      <div class="slot"><div class="box big">縮放</div></div>
      <div class="slot"><div class="box turn">旋轉</div></div>
      <div class="slot"><div class="box hinge">原點</div></div>
      <div class="slot"><div class="box combo">組合</div></div>
    </div>
    <h2>轉場</h2>
    <button class="go" type="button">指標移上來</button>
    <article class="lift">
      <h3>抬起的卡片</h3>
      <p>hover 時過渡，不要突然跳。</p>
    </article>
    <div class="tracks">
      <div class="track"><div class="dot"></div></div>
      <div class="track"><div class="dot linear"></div></div>
      <div class="track"><div class="dot ease-in"></div></div>
      <div class="track"><div class="dot ease-out"></div></div>
    </div>
    <h2>動畫</h2>
    <p><span class="hot">熱門</span> <span class="spin">載入</span></p>
    <article class="enter">
      <h3>進場</h3>
      <p>頁面打開就播放一次。</p>
    </article>
  </body>
</html>
