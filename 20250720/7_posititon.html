<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 50px;
      padding: 50px;
      background: #ccc;
      border: 1px solid #ff0;
      /* flexbox 效果，使內容居中心 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 204px);
    }

    .main {
      padding: 100px;
      background: #aaa;
      border: 1px solid #f00;
      position: relative;
    }

    .bigbox {
      width: 300px;
      border: 1px solid #000;
      background: rgb(209, 248, 248);
      font-size: 0;
      /* position: relative; */
      overflow: hidden;
    }

    .box {
      width: 50px;
      height: 50px;
      margin: 5px;
      color: white;
      background-color: darkcyan;
      text-align: center;
      line-height: 50px;
      display: inline-block;
      font-size: 1rem;
    }

    .relative {
      /* 相對定位，根據目前位置參考調整定位 */
      background-color: darkorange;
      position: relative;
      left: 20px;
      top: 20px;
      z-index: 5;
    }

    .absolute {
      /* 絕對定位，根據最近的定位(圖層型position)祖先元素為定位參考點調整 */
      background-color: darkorchid;
      position: absolute;
      /* opacity: 0.3; */
      left: -10px;
      top: 0;
    }

    .absolute-2 {
      position: absolute;
      background-color: darkslateblue;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* 這裡的50% 是 box 寬度 和高度的 25px，注意這是m0情況下可以完美至中*/
      /* 變形:視覺上欺騙平移 */
    }

    .absolute-3 {
      /* display: none; */
      position: absolute;
      background-color: darkgoldenrod;
      top: calc(100% / 2 - 30px);
      left: calc(100% / 2 - 30px);
      z-index: 10;
    }

    .fixed {
      /* 固定定位，直接以html的 viewport 為定位參考點調整 */
      position: fixed;
      background-color: darkseagreen;
      right: 50px;
      bottom: 50px;
      z-index: 999;
    }
  </style>
</head>

<body>

  <body>
    <!-- div.bigbox>div.box{$}*20 -->
    <main class="main">
      <div class="bigbox">
        <div class="box">01</div>
        <div class="box">02</div>
        <div class="box">03</div>
        <div class="box">04</div>
        <div class="box">05</div>
        <div class="box">06</div>
        <div class="box relative">07</div>
        <div class="box">08</div>
        <div class="box">09</div>
        <div class="box absolute">10</div>
        <div class="box">11</div>
        <div class="box absolute-2">12</div>
        <div class="box absolute-3">13</div>
        <div class="box">14</div>
        <div class="box">15</div>
        <div class="box">16</div>
        <div class="box fixed">17</div>
        <div class="box">18</div>
        <div class="box">19</div>
        <div class="box">20</div>
      </div>
    </main>
  </body>
</body>

</html>
