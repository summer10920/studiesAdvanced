<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>08 回家作業</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; max-width: 720px; }
      #status { min-height: 1.5em; }
      #tour-list { padding-left: 20px; }
    </style>
  </head>
  <body>
    <h1>行程列表</h1>
    <p>請用 Live Server 開啟，直接雙擊檔案讀不到 JSON。</p>
    <p>
      <button id="reload" type="button">重新載入</button>
      <button id="load-missing" type="button">讀取不存在的檔案</button>
    </p>
    <p id="status"></p>
    <ul id="tour-list"></ul>
    <p>收藏 <span id="fav-count">0</span> 筆</p>

    <h2>報名</h2>
    <form id="booking-form">
      <label>姓名 <input name="name" required /></label>
      <label>人數 <input name="people" type="number" min="1" max="8" required /></label>
      <button type="submit">送出</button>
    </form>
    <p id="booking-result"></p>

    <script>
      // 資料在 data/tours.json 與 data/departures.json
      const statusText = document.querySelector('#status');
      const tourList = document.querySelector('#tour-list');
      const favCount = document.querySelector('#fav-count');
      const reloadButton = document.querySelector('#reload');
      const missingButton = document.querySelector('#load-missing');
      const bookingForm = document.querySelector('#booking-form');
      const bookingResult = document.querySelector('#booking-result');

      let favorites = JSON.parse(localStorage.getItem('favorites') ?? '[]'); // 題目六：從 localStorage 還原

      // 讀 JSON；fetch 遇到 404 不會 reject，要自己檢查 response.ok
      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`); // name 是 Error；網路中斷則是 TypeError
        }
        return response.json();
      }

      // 題目六：收藏按鈕文字與數量
      function renderFavorites() {
        tourList.querySelectorAll('button').forEach((button) => {
          button.textContent = favorites.includes(button.dataset.id) ? '已收藏' : '收藏';
        });
        favCount.textContent = favorites.length;
      }

      function renderTours(tours, departures) {
        tourList.replaceChildren();
        tours.forEach((tour) => {
          // 題目三：依行程編號找出出發日數量
          const count = departures.find((item) => item.tourId === tour.id)?.departures.length ?? 0;

          const li = document.createElement('li');
          const info = document.createElement('span');
          info.textContent = `${tour.title}　${tour.days} 天　NT$${tour.price}　${count} 個出發日`;
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.id = tour.id;
          li.append(info, ' ', button);
          tourList.append(li);
        });
        renderFavorites();
      }

      // 題目一～四：載入流程。toursUrl 預設是正確的行程檔
      async function loadTours(toursUrl = 'data/tours.json') {
        reloadButton.disabled = true;
        statusText.textContent = '載入中';
        try {
          // 題目三：同時讀兩份，Promise.all 依陣列順序回傳結果
          const [tours, departures] = await Promise.all([fetchJson(toursUrl), fetchJson('data/departures.json')]);
          renderTours(tours, departures);
          statusText.textContent = `共 ${tours.length} 筆`;
        } catch (error) {
          // HTTP 錯誤顯示狀態碼，其他（網路中斷等）顯示讀取失敗；列表不動
          statusText.textContent = error.name === 'Error' ? error.message : '讀取失敗';
        } finally {
          reloadButton.disabled = false; // 成功失敗都要恢復
        }
      }

      reloadButton.addEventListener('click', () => loadTours());
      missingButton.addEventListener('click', () => loadTours('data/not-exist.json'));

      // 題目六：事件委派處理收藏
      tourList.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const id = button.dataset.id;
        favorites = favorites.includes(id) ? favorites.filter((favId) => favId !== id) : [...favorites, id];
        localStorage.setItem('favorites', JSON.stringify(favorites));
        renderFavorites();
      });

      // 題目五：送出報名
      bookingForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const submitButton = bookingForm.querySelector('button');
        const data = new FormData(bookingForm);
        submitButton.disabled = true;
        try {
          const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: data.get('name'), people: Number(data.get('people')) }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const result = await response.json();
          bookingResult.textContent = `已收到，編號 ${result.id}`;
        } catch (error) {
          bookingResult.textContent = '送出失敗';
        } finally {
          submitButton.disabled = false;
        }
      });

      loadTours();
    </script>
  </body>
</html>
