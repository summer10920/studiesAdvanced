<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>06 回家作業</title>
  </head>
  <body>
    <p>結果在 DevTools 的 Console。把你的程式寫在資料下面。</p>
    <script>
      const tours = [
        { id: 'taipei-beitou', title: '台北大稻埕與北投溫泉三日', region: '台北', theme: '城市', days: 3, price: 18600, featured: true, guide: { name: '阿凱' } },
        { id: 'keelung-jiufen', title: '基隆北海岸與九份兩日', region: '基隆', theme: '海岸', days: 2, price: 9200, featured: false },
        { id: 'hualien-taroko', title: '花蓮太魯閣與七星潭四日', region: '花蓮', theme: '山海', days: 4, price: 26800, featured: true, guide: { name: '小薇' } },
        { id: 'taitung-chishang', title: '台東池上與成功海岸三日', region: '台東', theme: '山海', days: 3, price: 21400, featured: true },
        { id: 'tainan-anping', title: '台南府城與安平兩日', region: '台南', theme: '古都', days: 2, price: 8800, featured: false },
        { id: 'kaohsiung-qijin', title: '高雄港都與旗津三日', region: '高雄', theme: '城市', days: 3, price: 14200, featured: false },
        { id: 'kinmen-villages', title: '金門聚落與戰地三日', region: '金門', theme: '離島', days: 3, price: 16800, featured: false },
        { id: 'kyoto-nara', title: '京都嵐山、伏見與奈良五日', region: '京都', theme: '日本', days: 5, price: 52800, featured: true },
      ];

      // 題目一：整理成一行文字（map 回傳新陣列，tours 不會被改動）
      const lines = tours.map((tour) => `${tour.title}｜${tour.days} 天｜NT$${tour.price}`);
      lines.forEach((line) => console.log(line));

      // 題目二：精選行程由便宜到貴
      // toSorted 交回排好的新陣列，不會動到 tours
      console.log('--- 題目二 ---');
      tours
        .filter((tour) => tour.featured)
        .toSorted((a, b) => a.price - b.price)
        .forEach((tour) => console.log(tour.title));

      // 題目三：三天以上最便宜的三個地區
      console.log('--- 題目三 ---');
      tours
        .filter((tour) => tour.days >= 3)
        .toSorted((a, b) => a.price - b.price)
        .slice(0, 3)
        .forEach((tour) => console.log(tour.region, tour.price));

      // 題目四：每種主題有幾筆行程
      console.log('--- 題目四 ---');
      const themeCount = tours.reduce((total, tour) => {
        total[tour.theme] = (total[tour.theme] ?? 0) + 1;
        return total;
      }, {});
      console.log(themeCount);

      // 題目五：領隊姓名與預設值
      console.log('--- 題目五 ---');
      tours.forEach((tour) => console.log(tour.guide?.name ?? '尚未安排'));

      // 題目六：調整價格，原資料不動
      console.log('--- 題目六 ---');
      const updatePrice = (list, id, newPrice) =>
        list.map((tour) => (tour.id === id ? { ...tour, price: newPrice } : tour));

      const newTours = updatePrice(tours, 'taitung-chishang', 19800);
      console.log('新陣列：', newTours.find((tour) => tour.id === 'taitung-chishang').price); // 19800
      console.log('原陣列：', tours.find((tour) => tour.id === 'taitung-chishang').price); // 21400
    </script>
  </body>
</html>
