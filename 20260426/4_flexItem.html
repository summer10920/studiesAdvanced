<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      background-color: lightgoldenrodyellow;
      width: 100%;
      height: 800px;
      display: flex;
      flex-direction: row;
      align-items: center;

      .item {
        width: 100px;
        height: 100px;
        background-color: lightblue;
        border: 1px solid black;
        margin: 10px;
        padding: 10px;
      }

      .item.custom1 {
        order: 5;
      }

      .item.custom2 {
        order: 1;
      }

      .item.custom3 {
        order: -1;
      }

      .item.custom4 {
        align-self: stretch;
        height: auto;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item custom1">box1</div>
    <div class="item custom2">box2</div>
    <div class="item custom3">box3</div>
    <div class="item custom4">box4</div>
  </div>
</body>

</html>
