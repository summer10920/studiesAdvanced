<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制迴圈</title>
</head>

<body>
  <h1>透過 continue(跳過), break(破壞) 來控制迴圈</h1>
  <script>
    for (let num = 0; num < 10; num++) {
      if (num === 5) continue;
      if (num === 7) break;
      console.log(num);
    }
    console.log('done');

  </script>
</body>

</html>
