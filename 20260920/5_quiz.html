<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 使用 for 迴圈印出 1 到 100 的奇數
    for (let i = 1; i < 101; i += 2) console.log(i);

    // 使用 while 迴圈計算 1 到 100 的總和
    let sum = 0;
    let i = 1;
    while (i <= 100) {
      sum += i;
      i++;
    }
    console.log(sum);

    // 使用巢狀迴圈印出一個 5×5 的星號方陣
    let result = '';

    for (let j = 0; j < 5; j++) {
      for (let i = 0; i < 5; i++) result += '⭐';
      result += '\n';
    }
    console.log(result);

    //bonus, 單迴圈完成印出一個 5×5 的星號方陣
    // ----------------------------------
    console.clear();

    let result2 = '';
    for (let i = 0; i < 25; i++) {
      result2 += '⭐';
      if ((i + 1) % 5 === 0) result2 += '\n';
    }
    console.log(result2);

    console.clear();

    //bonus, 單迴圈完成99乘法表
    // ----------------------------------
    let result3 = '';
    // 初始動作, 條件判斷, 迴圈結束時執行
    for (let j = 2, i = 1; j < 10; i++) {
      result3 += `${j} x ${i} = ${j * i}\n`;
      // ex: j=2, i=9
      if (j !== 9 && i === 9) result3 += '---------------------\n';
      if (i === 9) {
        j++;
        i = 0;
      }
    }
    console.log(result3);

  </script>
</body>

</html>
