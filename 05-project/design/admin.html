<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>後台草稿 · 洛奇旅行</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      h1 { font-size: 1.875rem; }
      h2 { font-size: 1.25rem; }
      p { font-size: 1rem; }
    </style>
  </head>
  <body class="flex min-h-screen flex-col bg-mist font-sans text-base text-ink antialiased">
    <load src="./partials/header.html" />
    <main class="mx-auto w-full max-w-6xl px-4 pt-10 pb-16 sm:px-6 sm:pt-12 sm:pb-20">
      <h1 class="font-sans text-3xl font-semibold leading-tight tracking-tight text-ink">行程後台</h1>
      <p class="mt-3 max-w-prose text-base leading-relaxed text-moss">表格與表單只在瀏覽器裡改給你看。重新整理就回到這份稿，沒有寫進檔案。僅本機／設計稿。</p>
      <div class="mt-10 grid min-w-0 grid-cols-1 gap-10 lg:grid-cols-[minmax(0,1.5fr)_minmax(18rem,1fr)] lg:items-start">
        <section class="min-w-0" aria-labelledby="admin-table-title">
          <div class="flex items-center justify-between gap-3 border-b border-tide pb-3">
            <h2 id="admin-table-title" class="font-sans text-xl font-semibold text-ink">行程</h2>
            <button id="admin-new" class="inline-flex min-h-11 items-center border border-pine bg-paper px-3 text-base font-medium text-pine hover:bg-foam" type="button">新增</button>
          </div>
          <div class="overflow-x-auto">
            <table id="admin-table" class="w-full min-w-[36rem] text-left text-base">
              <thead class="bg-foam text-ink">
                <tr>
                  <th class="px-3 py-2.5 font-medium" scope="col">名稱</th>
                  <th class="px-3 py-2.5 font-medium" scope="col">地點</th>
                  <th class="px-3 py-2.5 font-medium" scope="col">天數</th>
                  <th class="px-3 py-2.5 font-medium" scope="col">價錢</th>
                  <th class="px-3 py-2.5 font-medium" scope="col">操作</th>
                </tr>
              </thead>
              <tbody>
                <tr class="border-b border-tide hover:bg-foam" data-id="1" data-title="台北城市漫遊" data-place="台北" data-days="3" data-price="12800" data-image="https://picsum.photos/id/1018/800/500" data-intro="迪化街、大稻埕河岸，最後一晚住在老屋改建的旅社。">
                  <td class="px-3 py-3 font-medium" data-cell="title">台北城市漫遊</td>
                  <td class="px-3 py-3" data-cell="place">台北</td>
                  <td class="px-3 py-3 tabular-nums" data-cell="days">3 天</td>
                  <td class="px-3 py-3 tabular-nums" data-cell="price">NT$12,800</td>
                  <td class="px-3 py-3">
                    <button class="min-h-11 px-2 text-base font-medium text-pine hover:bg-foam" type="button" data-action="edit">編輯</button>
                    <button class="min-h-11 px-2 text-base font-medium text-moss hover:bg-foam hover:text-ink" type="button" data-action="delete">刪除</button>
                  </td>
                </tr>
                <tr class="border-b border-tide hover:bg-foam" data-id="2" data-title="花蓮山海" data-place="花蓮" data-days="4" data-price="18600" data-image="https://picsum.photos/id/1016/800/500" data-intro="清水斷崖看海，晚上回壽豐的小旅店，隔天再進太魯閣。">
                  <td class="px-3 py-3 font-medium" data-cell="title">花蓮山海</td>
                  <td class="px-3 py-3" data-cell="place">花蓮</td>
                  <td class="px-3 py-3 tabular-nums" data-cell="days">4 天</td>
                  <td class="px-3 py-3 tabular-nums" data-cell="price">NT$18,600</td>
                  <td class="px-3 py-3">
                    <button class="min-h-11 px-2 text-base font-medium text-pine hover:bg-foam" type="button" data-action="edit">編輯</button>
                    <button class="min-h-11 px-2 text-base font-medium text-moss hover:bg-foam hover:text-ink" type="button" data-action="delete">刪除</button>
                  </td>
                </tr>
                <tr class="border-b border-tide hover:bg-foam" data-id="3" data-title="台南古都" data-place="台南" data-days="2" data-price="9800" data-image="https://picsum.photos/id/1036/800/500" data-intro="早上走孔廟一帶，下午把時間留給小吃，不趕下一站。">
                  <td class="px-3 py-3 font-medium" data-cell="title">台南古都</td>
                  <td class="px-3 py-3" data-cell="place">台南</td>
                  <td class="px-3 py-3 tabular-nums" data-cell="days">2 天</td>
                  <td class="px-3 py-3 tabular-nums" data-cell="price">NT$9,800</td>
                  <td class="px-3 py-3">
                    <button class="min-h-11 px-2 text-base font-medium text-pine hover:bg-foam" type="button" data-action="edit">編輯</button>
                    <button class="min-h-11 px-2 text-base font-medium text-moss hover:bg-foam hover:text-ink" type="button" data-action="delete">刪除</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
        <section class="border border-tide bg-paper p-5" aria-labelledby="admin-mode">
          <h2 id="admin-mode" class="font-sans text-xl font-semibold text-ink">編輯行程</h2>
          <form id="admin-form" class="mt-5 space-y-4" action="#" method="post">
            <div>
              <label class="block text-base font-medium text-ink" for="admin-id">編號</label>
              <input id="admin-id" class="mt-1.5 min-h-11 w-full border border-tide bg-paper px-3 text-base text-ink" name="id" type="text" value="1" required />
            </div>
            <div>
              <label class="block text-base font-medium text-ink" for="admin-title">名稱</label>
              <input id="admin-title" class="mt-1.5 min-h-11 w-full border border-tide bg-paper px-3 text-base text-ink" name="title" type="text" value="台北城市漫遊" required />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-base font-medium text-ink" for="admin-place">地點</label>
                <input id="admin-place" class="mt-1.5 min-h-11 w-full border border-tide bg-paper px-3 text-base text-ink" name="place" type="text" value="台北" required />
              </div>
              <div>
                <label class="block text-base font-medium text-ink" for="admin-days">天數</label>
                <input id="admin-days" class="mt-1.5 min-h-11 w-full border border-tide bg-paper px-3 text-base text-ink tabular-nums" name="days" type="number" min="1" value="3" required />
              </div>
            </div>
            <div>
              <label class="block text-base font-medium text-ink" for="admin-price">價錢</label>
              <input id="admin-price" class="mt-1.5 min-h-11 w-full border border-tide bg-paper px-3 text-base text-ink tabular-nums" name="price" type="number" min="0" value="12800" required />
            </div>
            <div>
              <label class="block text-base font-medium text-ink" for="admin-image">圖片網址</label>
              <input id="admin-image" class="mt-1.5 min-h-11 w-full border border-tide bg-paper px-3 text-base text-ink" name="image" type="url" value="https://picsum.photos/id/1018/800/500" />
            </div>
            <div>
              <label class="block text-base font-medium text-ink" for="admin-intro">介紹</label>
              <textarea id="admin-intro" class="mt-1.5 w-full border border-tide bg-paper px-3 py-2 text-base leading-relaxed text-ink" name="intro" rows="4">迪化街、大稻埕河岸，最後一晚住在老屋改建的旅社。</textarea>
            </div>
            <button class="inline-flex min-h-11 w-full items-center justify-center bg-pine px-4 text-base font-medium text-white hover:bg-pine-deep" type="submit">儲存到畫面</button>
            <p id="admin-status" class="min-h-5 text-base leading-relaxed text-ink" role="status"></p>
          </form>
        </section>
      </div>
    </main>
    <load src="./partials/footer.html" />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
