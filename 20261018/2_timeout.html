  <script>

    // const timeoutId = setTimeout(function () {

    // clearTimeout(timeoutId);

    // setInterval - 重複執行

    let count = 0;
    const intervalId = setInterval(() => {
      console.log(`hey~~${count}`);
      count++;
      (count === 5) && clearInterval(intervalId);
    }, 1000);


    let count2 = 0;

    function doOnce() {
      console.log('只執行一次');
      count2++;
      if (count2 < 5) setTimeout(doOnce, 1000);
    }
    doOnce();





  </script>
