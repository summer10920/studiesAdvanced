<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .active {
      color: blue;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="container">
    <p id="loki" style="font-size:30px">第一段文字</p>
    <p class="text">第二段文字</p>
    <p>第三段文字</p>
  </div>
  <script>
    const el = document.querySelector('#loki');
    // el.setAttribute('style', 'color:red')

    // element.style.* - 精確控制單一屬性
    el.style.color = 'purple';
    el.style.color = 'red';
    el.style.backgroundColor = 'blue';
    loki.style.fontSize;

    // element.style - 直接設定 style 屬性（會覆蓋所有現有樣式）
    // el.setAttribute('style', 'color:blue; font-size:24px');
    el.style = 'color:blue; font-size:24px';


    // Object.assign() - 批量設定，程式碼簡潔, 不會整個覆蓋所有樣式
    Object.assign(el.style, {
      color: 'yellow',
      backgroundColor: 'green'
    });

    //  cssText - 使用 cssText 一次性設定，效能較好(雷同 element.style 效果, 會整個覆蓋)
    el.style.cssText = 'color:blue; font-size:24px';

    // setProperty() - 支援 CSS 原生變數和複雜值
    el.style.setProperty('font-weight', 'bold');
  </script>
</body>

</html>
