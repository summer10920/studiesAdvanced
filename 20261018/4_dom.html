<html lang="en">

<head>
  <meta charset="UTF-8">

<body>
  <h1 id="title"><mark>我的</mark>網頁</h1>
  <div id="container">

    <p>第三段文字</p> -->
  </div>

    // myH1.textContent;
    // myH1.innerHTML;
    myH1.textContent = '改<mark>過</mark>的文字';
    myH1.innerHTML = '改<mark>過</mark>的文字';

    <div>這是第一段</div>
    <div>這<mark>是</mark>第二段</div>
    `;
    document.querySelector('#container').innerHTML += '<div>這是第三段</div>';

    myH1.id = 'id-loki';

    const loki = document.querySelector('#acc');
    loki.getAttribute('value');
    loki.setAttribute('value', 'userName'); // 慢
    loki.value = '使用者名稱'; // 快

    loki.value = ''; // 指定 value 為空字串
    loki.value = null; // 指定 value 為 null

  </script>
