<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    body {
      /* font-family: 'Courier New', "Microsoft JhengHei", Courier, monospace, sans-serif; */
      font-family: "Roboto", "Noto Sans TC", sans-serif;
      /* 利用優先順序，先套英文font再套中文font，才能實現英文字套en font, 中文套 tw font */
    }

    /* .lang-en {
      font-family: "Roboto", sans-serif;
    }

    .lang-tw {
      font-family: "Noto Sans TC", sans-serif;
    } */
  </style>
</head>

<body>
  <div>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam, assumenda.</div>
  <div>很多不禁戀愛 Lorem ipsum dolor sit 市委不必公路辛苦俱樂部浙江執行時間期待認證，良。</div>
  <hr>
  <div class="lang-en">Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam, assumenda.</div>
  <div class="lang-tw">很多不禁戀愛市委不必公路辛苦俱樂部浙江執行時間期待認證，良。</div>
