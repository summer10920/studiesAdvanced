<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/css/bootstrap.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>
  <style>
    div{
      min-height: 100px;
      border:1px solid;
      margin-bottom: 4rem;
    }
  </style>
</head>

<body>
  <div class="container">
    container. 永遠是窄版
  </div>
  <div class="container-sm">
    container-sm. 在 sm 以上才是窄版
  </div>
  <div class="container-md">
    container-md. 在 md 以上才是窄版
  </div>
  <div class="container-lg">
    container-lg. 在 lg 以上才是窄版
  </div>
  <div class="container-xl">
    container-xl. 在 xl 以上才是窄版
  </div>
  <div class="container-xxl">
    container-xxl. 在 xxl 以上才是窄版
  </div>
  <div class="container-fluid">
    container-fluid. 永遠不是窄版</div>
</body>

</html>
