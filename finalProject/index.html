<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洛奇營地渡假村 - 溫泉露營</title>
  <!-- favicon -->
  <link rel="shortcut icon" href="./media/favicon.ico" type="image/x-icon">
  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <!-- bootstrap -->
  <link rel="stylesheet" href="./plugins/bootstrap.min.css">
  <script src="./plugins/bootstrap.bundle.min.js"></script>
  <!-- font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
    crossorigin="anonymous" />
  <!-- custom css -->
  <link rel="stylesheet" href="./plugins/style.css">
</head>

<body>
  <section id="lokiSlider" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#lokiSlider" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#lokiSlider" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#lokiSlider" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item vh-100 active">
        <img src="https://picsum.photos/1920/1080/?random=10" class="d-block w-100 h-100 object-fit-cover">
        <div class="carousel-caption z-1 text-start">
          <h3>
            <label class="badge text-bg-primary">動態</label>
            <label class="badge text-bg-secondary">病毒</label>
          </h3>
          <h2 class="display-2 fw-bolder">拉近人的溫暖</h2>
          <p class="d-none d-md-block">發現一座充滿能量的秘密營地，探索山林賦予的自在</p>
        </div>
      </div>
      <div class="carousel-item vh-100">
        <img src="https://picsum.photos/1920/1080/?random=11" class="d-block w-100 h-100 object-fit-cover">
        <div class="carousel-caption z-1 text-start">
          <h3>
            <label class="badge text-bg-success">汽車</label>
            <label class="badge text-bg-danger">保持</label>
          </h3>
          <h2 class="display-2 fw-bolder">體驗大自然的空氣</h2>
          <p class="d-none d-md-block">遠離塵囂的夢想園地，也是一個讓家人朋友們能夠更親密、更快樂的童話村！</p>
        </div>
      </div>
      <div class="carousel-item vh-100">
        <img src="https://picsum.photos/1920/1080/?random=12" class="d-block w-100 h-100 object-fit-cover">
        <div class="carousel-caption z-1 text-start">
          <h3>
            <label class="badge bg-warning">不行</label>
            <label class="badge bg-info">不明</label>
          </h3>
          <h2 class="display-2 fw-bolder">山間裡裸湯</h2>
          <p class="d-none d-md-block">被山包圍的裸湯，讓毛細孔全開，同時享受湯浴和森林浴，雙重享受，雙重療癒。</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev w-auto" type="button" data-bs-target="#lokiSlider" data-bs-slide="prev">
      <i class="fa-solid fa-caret-left"></i>
    </button>
    <button class="carousel-control-next w-auto" type="button" data-bs-target="#lokiSlider" data-bs-slide="next">
      <i class="fa-solid fa-caret-right"></i>
    </button>
  </section>
</body>

</html>
