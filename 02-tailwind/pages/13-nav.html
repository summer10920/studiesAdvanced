<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>導覽列</title>
  </head>
  <body>
    <load src="../partials/nav.html" p13="page" />
    <!-- TODO: 講義「導覽列」。只做一套 nav。
         checkbox 加 peer 與 sr-only，id 對到 label 的 for。nav 必須寫在 input 後面。
         預設 hidden；勾選後 peer-checked:flex，直向、絕對定位蓋住內容。
         md 以上改回橫排並顯示，選單標籤用 md:hidden 收起。視窗拉到約 390px 再拉過 768px 檢查。 -->
    <header>
      <div>
        <a href="/">洛奇旅行</a>
        <input id="nav-toggle" type="checkbox" />
        <label for="nav-toggle">選單</label>
        <nav>
          <a href="#home">首頁</a>
          <a href="#tours">行程</a>
          <a href="#about">關於</a>
        </nav>
      </div>
    </header>
    <main>
      <h1>把視窗拉窄再拉寬</h1>
      <p>窄的時候按「選單」。寬到 md 之後，連結回到橫排，按鈕隱藏。</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
