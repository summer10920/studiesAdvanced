<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表單欄位</title>
  </head>
  <body>
    <load src="../partials/nav.html" p14="page" />
    <!-- TODO: 講義「表單欄位」。表單水平置中、限制寬度、白底、圓角、陰影。欄位之間留縫。
         label 的 for 對到控制項 id。輸入框寬度 100%。聚焦用 focus-visible 加環，並搭配 outline-none。
         核取方塊用 accent 改成青綠。送出鈕 type="submit"，action 維持 #。用 Tab 走過每一格。 -->
    <form action="#" method="get">
      <h1>索取行程表</h1>
      <div>
        <label for="guest">姓名</label>
        <input id="guest" name="guest" type="text" autocomplete="name" required />
      </div>
      <div>
        <label for="mail">Email</label>
        <input id="mail" name="mail" type="email" autocomplete="email" required />
      </div>
      <div>
        <label for="note">想去的地區</label>
        <textarea id="note" name="note" rows="4"></textarea>
      </div>
      <label>
        <input type="checkbox" name="copy" />
        寄一份副本給我
      </label>
      <button type="submit">送出（停在本頁）</button>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
