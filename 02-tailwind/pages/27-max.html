    <title>範圍變體</title>

  <body>
    <load src="../partials/nav.html" p27="page" />
    <!-- TODO: 講義「max-* 範圍變體」。三句預設 hidden。
         第一句只在小於 md 時顯示（max-md:）。
         第二句只在 md 以上、小於 xl 時顯示（md:max-xl:）。
         第三句 xl 以上顯示。
         max-md: 是視窗寬度的變體，不是 max-w-md。 -->
    <h1>max-md: 是小於 md，不是 max-w-md</h1>
    <p>小於 md（48rem）才看得到這句。</p>
    <p>md 以上、且小於 xl（80rem）。</p>
    <p>xl 以上一直顯示。</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
