<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手動切換深色</title>
  </head>
  <body>
    <load src="../partials/nav.html" p10="page" />
    <!-- TODO: 講義「選讀：手動切換（@custom-variant）」。
         淺色與 dark: 各寫一組。按鈕 id 必須是 theme-toggle。
         這一頁改載入 /src/dark-toggle.js，不要再載入 main.js。
         variant 寫在 src/dark-manual.css，切換邏輯寫在 src/dark-toggle.js。 -->
    <header>
      <p>洛奇旅行</p>
      <button id="theme-toggle" type="button">切換深色</button>
    </header>
    <main>
      <h1>按鈕決定這一頁的外觀</h1>
      <p>html 上有 dark 這個 class 時，dark: 才生效。重新整理會記住上次的選擇。</p>
      <article>
        <h2>花蓮山海</h2>
        <p>兩天一夜。卡片的底也跟著換。</p>
      </article>
    </main>
    <script type="module" src="/src/dark-toggle.js"></script>
  </body>
</html>
