<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跟隨系統深色</title>
  </head>
  <body>
    <load src="../partials/nav.html" p09="page" />
    <!-- TODO: 講義「跟著系統」。同一份 HTML：淺色寫沒有前綴的 class，深色寫 dark:。
         表單控制項用 scheme-light 與 dark:scheme-dark。不要加按鈕，也不要載入 dark-toggle.js。
         檢查方式是作業系統外觀，或 Chrome Rendering 的 prefers-color-scheme。 -->
    <main>
      <p>跟著作業系統的外觀</p>
      <h1>深色時這塊會換底</h1>
      <p>沒有按鈕。系統是淺色就用沒有前綴的 class；系統是深色才套 dark:。</p>
      <article>
        <h2>台北城市漫遊</h2>
        <p>三天 · 含早餐</p>
      </article>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
