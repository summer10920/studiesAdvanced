         不要在同一個軸上又寫 gap 又寫 space-y。 -->

      <h1>間距以 0.25rem 為一格</h1>
      <div>
        <div>
          <div></div>
          <p>size-4</p>
        </div>
        <div>
          <div></div>
          <p>w-16 h-8</p>

        <div>
          <div>p-4 內距</div>

      <p>text-sm 輔助</p>
