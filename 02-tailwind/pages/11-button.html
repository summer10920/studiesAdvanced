<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>按鈕</title>
  </head>
  <body>
    <load src="../partials/nav.html" p11="page" />
    <!-- TODO: 講義「按鈕」。四顆橫向排列、可換行、垂直置中。
         實心用 a：深底白字，滑過再深一階，鍵盤聚焦加外框。線框用 button：白底、深色框。
         文字按鈕滑過才加底線。已額滿加上 disabled 與 cursor-not-allowed，顏色改 stone。
         不要用 div 假裝按鈕。 -->
    <h1>三種按鈕</h1>
    <div>
      <a href="#tours">實心連結</a>
      <button type="button">線框按鈕</button>
      <button type="button">文字按鈕</button>
      <button type="button" disabled>已額滿</button>
    </div>
    <p>連結用 a，本頁動作用 button。停用的按鈕加 disabled，顏色改灰。</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
