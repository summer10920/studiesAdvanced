<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex 與 Grid</title>
  </head>
  <body>
    <!-- TODO: 講義「Flex 與 Grid」。
         上半：flex、items-center、justify-between、放不下就換行。品牌名在左，兩個連結在右。
         下半：grid。預設一欄，sm 兩欄，lg 三欄，格子之間用 gap。 -->
    <section>
      <h1>Flex：一列排開</h1>
      <div>
        <p>洛奇旅行</p>
        <div>
          <a href="#a">行程</a>
          <a href="#b">關於</a>
        </div>
      </div>
    </section>
    <section>
      <h2>Grid：卡片牆</h2>
      <div>
        <article>
          <h3>台北</h3>
          <p>3 天</p>
        </article>
        <article>
          <h3>花蓮</h3>
          <p>2 天</p>
        </article>
        <article>
          <h3>台南</h3>
          <p>4 天</p>
        </article>
      </div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
