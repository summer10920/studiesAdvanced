<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 50px;
      padding: 50px;
      background: #ccc;
      border: 1px solid #ff0;
      /* flexbox 效果，使內容居中心 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 204px);
    }

    .main {
      padding: 100px;
      background: #aaa;
      border: 1px solid #f00;
      position: relative;

      .bigbox {
        width: 300px;
        border: 1px solid #000;
        background: rgb(209, 248, 248);
        display: flex;
        flex-wrap: wrap;

        /* transform: scale(1); */
        .box {
          width: 50px;
          height: 50px;
          margin: 5px;
          color: white;
          background-color: darkcyan;
          text-align: center;
          line-height: 50px;
        }

        .relative {
          /* 關係圖層 */
          position: relative;
          background-color: lightcoral;
          left: 50px;
          top: 10px;
          z-index: 5;
        }

        .absolute {
          /* 
          相對"於誰"的圖層
          會一路向上尋找
          誰持有 position (不包含 static) 作為參考定位
          但是遇到持有 transform 的元素會強制留住在此
          */
          position: absolute;
          background-color: lightblue;
          left: 50%;
          top: 40%;
        }

        .fixed {
          /* 
          固定圖層
          相對"整個畫面"的圖層
          但是遇到持有 transform 的元素會強制留住在此
          */
          position: fixed;
          background-color: lightgreen;
          left: 47%;
          top: 45%;
          z-index: 1;
        }
      }
    }
  </style>
</head>

<body>

  <body>
    <!-- div.bigbox>div.box{$}*20 -->
    <div class="main">
      <div class="bigbox">
        <div class="box">01</div>
        <div class="box">02</div>
        <div class="box">03</div>
        <div class="box">04</div>
        <div class="box">05</div>
        <div class="box">06</div>
        <div class="box relative">07</div>
        <div class="box">08</div>
        <div class="box">09</div>
        <div class="box absolute">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
        <div class="box">13</div>
        <div class="box">14</div>
        <div class="box">15</div>
        <div class="box">16</div>
        <div class="box fixed">17</div>
        <div class="box">18</div>
        <div class="box">19</div>
        <div class="box">20</div>
      </div>
    </div>
  </body>
</body>

</html>
