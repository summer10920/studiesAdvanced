<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    a {
      color: black;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: bold;
      /* transition: color 5s, background-color 2s; */
      transition: 0.5s;
      /* transition-duration: 5s;
      transition-timing-function: ease;
      transition-delay: 0s;
      transition-property: all; */
    }

    a:hover {
      color: red;
      background-color: black;
    }

    div.demo1 {
      width: 100px;
      height: 100px;
      background-color: lightblue;
      transition: 5s;

      &:hover {
        background-color: lightgoldenrodyellow;
        /* width: 200px;
      height: 200px; */
        /* transform: rotate(360deg); */
        transform: translate(200px);
      }
    }

    div.demo2 {
      div {
        width: 100px;
        height: 100px;
        background-color: lightblue;
        position: relative;
        left: 0;

        transition: all 5s;
        /* transition-duration: 5s;
        transition-timing-function: ease;
        transition-delay: 0s;
        transition-property: all; */
      }

      &:hover div {
        
        background-color: lightgoldenrodyellow;
        /* transform: translate(200px); */
        left: 400px;
      }
    }
  </style>
</head>

<body>
  <div class="demo2">
    <div>B</div>
  </div>
  <hr>
  <div class="demo1">A</div>
  <hr>
